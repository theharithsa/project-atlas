name: Bug report
description: Safe reproduction and expected behavior
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Which view, filter or public board shows the problem?
      description: Include steps, the feed check time and a public source link if available. Redact private issue titles and credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact, version and environment
