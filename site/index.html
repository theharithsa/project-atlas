<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7fa" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Live public GitHub project boards, current sprints, backlogs, release roadmaps and closed-issue history."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Project Atlas · Delivery overview</title>
    <link rel="icon" href="assets/atlas.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/dm-sans.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <div class="shell">
      <aside class="rail" id="desktop-nav" aria-label="Workspace navigation"></aside>
      <div class="workspace">
        <header id="topbar" class="topbar"></header>
        <main id="content" tabindex="-1" class="main">
          <p class="initial">Checking public GitHub projects…</p>
        </main>
      </div>
    </div>
    <dialog id="mobile-menu" aria-label="Workspace navigation"></dialog>
    <noscript
      ><p>
        Enable JavaScript to view live GitHub projects.
      </p></noscript
    >
    <script type="module" src="app.js"></script>
  </body>
</html>
